name: stayra

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: stayra
      POSTGRES_USER: stayra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stayra -d stayra" ]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=stayra;Username=stayra;Password=${POSTGRES_PASSWORD:-stayra}
      Jwt__Key: ${JWT_KEY:-docker-dev-insecure-key-change-me-0123456789}
      App__WebBaseUrl: ${WEB_BASE_URL:-http://localhost:5173}
      Cors__Origins: ${WEB_BASE_URL:-http://localhost:5173}
      Storage__Root: /data/uploads
      Vnpay__TmnCode: ${VNPAY_TMN_CODE:-}
      Vnpay__HashSecret: ${VNPAY_HASH_SECRET:-}
      Vnpay__IpnBaseUrl: ${PUBLIC_API_URL:-http://localhost:8080}
      Vnpay__ReturnBaseUrl: ${WEB_BASE_URL:-http://localhost:5173}
      Vnpay__Offline: ${VNPAY_OFFLINE:-false}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Anthropic__Model: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      Embeddings__VoyageApiKey: ${VOYAGE_API_KEY:-}
      Zalo__WebBaseUrl: ${WEB_BASE_URL:-http://localhost:5173}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Stayra}
      Smtp__WebBaseUrl: ${WEB_BASE_URL:-http://localhost:5173}
      Deplao__DefaultBaseUrl: ${DEPLAO_BASE_URL:-http://deplao:27800/api/v1}
      Deplao__WebPassword: ${DEPLAO_WEB_PASSWORD:-stayra-deplao-local-1234}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ./frontend
      dockerfile: ../docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  deplao:
    build:
      context: ./deplao
      dockerfile: ../docker/deplao.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLAO_WEB: 1
      DEPLAO_CHANNELS_ONLY: 1
      DEPLAO_WEB_PASSWORD: ${DEPLAO_WEB_PASSWORD:-stayra-deplao-local-1234}
      DEPLAO_WEB_PORT: 27800
      DEPLAO_WEB_HOST: 0.0.0.0
      DEPLAO_WEB_SECURE: 0
    ports:
      - "27800:27800"
    volumes:
      - deplao_data:/root/.config/deplao

  # Optional: expose the API publicly so MoMo IPN and Zalo webhooks can reach it.
  #   docker compose --profile tunnel up
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [ "tunnel" ]
    command: http api:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  deplao_data:
